<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="努力攒钱">
<meta name="theme-color" content="#82B0C9">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>努力攒钱 🌊</title>
<style>
:root{
  --bg:#F6F3EA;--bg-warm:#ECE7DA;--card:#FFFFFF;--card-soft:#FBF9F3;
  --ink:#5C6B6E;--ink-soft:#8A989C;--ink-light:#B6C0C2;--line:#E8E2D4;
  --accent:#82B0C9;--accent-dark:#5E8CAE;--accent-soft:#E6EFF3;
  --rose-soft:#FBE9E6;--amber-soft:#FBF0DC;--green-soft:#E6F2E6;--purple-soft:#ECE8F4;
  --warn-bg:#FBF0DC;--warn-line:#EAD9B0;--warn-text:#A9824C;
  --ok-text:#6FA86F;--danger:#D98C84;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink)}
.layout{display:flex;min-height:100vh}
.sidebar{width:210px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;z-index:40}
.sidebar-brand{display:flex;align-items:center;gap:8px;padding:0 6px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sidebar-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9CC3D8,#5E8CAE);display:flex;align-items:center;justify-content:center;overflow:hidden}.sidebar-brand .logo img{width:100%;height:100%;object-fit:cover}
.sidebar-brand .name{font-size:15px;font-weight:700;color:var(--ink)}
.sidebar-brand .sub{font-size:10px;color:var(--ink-soft);margin-top:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;transition:all .15s}
.nav-item:hover{background:var(--bg-warm)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-dark)}
.nav-item .ni-icon{font-size:18px;width:22px;text-align:center}
.nav-add{margin:10px 6px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#9CC3D8,#5E8CAE);color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(94,140,174,.25)}
.sidebar-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:10px;color:var(--ink-light);line-height:1.6}
.main{flex:1;min-width:0;max-width:560px;margin:0 auto}
.page{display:none;min-height:100vh;padding-bottom:30px}.page.active{display:block}
.tabular{font-variant-numeric:tabular-nums}
.header-grad{background:linear-gradient(150deg,#9CC3D8 0%,#82B0C9 50%,#6E9CB6 100%);position:relative;overflow:hidden;border-radius:0 0 24px 24px}
.header-grad::after{content:'';position:absolute;top:-50px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.12);border-radius:50%}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 10px rgba(130,176,201,.08);border:1px solid var(--line)}
.btn{padding:10px 20px;border-radius:14px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:14px;font-size:13px;z-index:100;transition:transform .25s;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
input,select{font-family:inherit;outline:none;border:none;background:transparent}
.tabbar{display:none}
@media(max-width:760px){
  .layout{flex-direction:column}
  .sidebar{display:none}
  .main{max-width:430px}
  .page{padding-bottom:84px}
  .tabbar{display:block;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:50}
  .tabbar-inner{display:flex;justify-content:space-around;align-items:flex-start;padding:8px 0 20px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-light);flex:1;cursor:pointer}
  .tab.active{color:var(--accent-dark)}
  .tab-icon{font-size:20px}
  .tab-add{width:50px;height:50px;background:linear-gradient(135deg,#9CC3D8,#5E8CAE);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;margin-top:-22px;box-shadow:0 6px 14px rgba(94,140,174,.3);border:3px solid #fff;cursor:pointer}
}
</style>
</head>
<body>
<div id="toast"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo"><img src="/icons/icon-192.png" alt="logo"></div>
      <div><div class="name">努力攒钱</div><div class="sub">一起攒钱吧 🌸</div></div>
    </div>
    <div class="nav-item active" data-page="home"><span class="ni-icon">🏡</span>首页</div>
    <div class="nav-item" data-page="transactions"><span class="ni-icon">📖</span>月底流水</div>
    <div class="nav-add" data-page="add">＋ 记一笔</div>
    <div class="nav-item" data-page="settings"><span class="ni-icon">⚙️</span>设置</div>
    <div class="sidebar-foot">💡 添加到桌面：<br>Safari 分享 → 添加到主屏幕</div>
  </aside>
  <main class="main">
    <div id="page-home" class="page active"></div>
    <div id="page-add" class="page"></div>
    <div id="page-transactions" class="page"></div>
    <div id="page-settings" class="page"></div>
  </main>
  <div class="tabbar"><div class="tabbar-inner">
    <div class="tab active" data-page="home"><div class="tab-icon">🏡</div>首页</div>
    <div class="tab" data-page="transactions"><div class="tab-icon">📖</div>月底流水</div>
    <div class="tab-add" data-page="add">＋</div>
    <div class="tab" data-page="settings"><div class="tab-icon">⚙️</div>设置</div>
  </div></div>
</div>
<script>
const DEF_CATS=[
{key:'rent',emoji:'🏠',label:'房租',type:'expense',bg:'#FBE9E6',iconBg:'linear-gradient(135deg,#F9A8D4,#F472B6)'},
{key:'utility',emoji:'💡',label:'水电费',type:'expense',bg:'#FBF0DC',iconBg:'linear-gradient(135deg,#FDE68A,#F59E0B)'},
{key:'meal',emoji:'🍜',label:'一起吃饭',type:'expense',bg:'#FBEFE2',iconBg:'linear-gradient(135deg,#FDBA74,#F97316)'},
{key:'travel',emoji:'✈️',label:'旅行',type:'expense',bg:'#ECE8F4',iconBg:'linear-gradient(135deg,#C4B5FD,#8B5CF6)'},
{key:'grocery',emoji:'🛒',label:'采购',type:'expense',bg:'#E6F2E6',iconBg:'linear-gradient(135deg,#86EFAC,#22C55E)'},
{key:'car',emoji:'🚗',label:'加油保养',type:'expense',bg:'#E6EFF3',iconBg:'linear-gradient(135deg,#9CC3D8,#5E8CAE)'},
{key:'fun',emoji:'🎮',label:'娱乐',type:'expense',bg:'#FBEFE6',iconBg:'linear-gradient(135deg,#FCA5A5,#EF4444)'},
{key:'other_exp',emoji:'📦',label:'其他支出',type:'expense',bg:'#F1EDE4',iconBg:'linear-gradient(135deg,#CBD5E1,#94A3B8)'},
{key:'saving',emoji:'🌊',label:'存入荷包',type:'income',bg:'#E6EFF3',iconBg:'linear-gradient(135deg,#9CC3D8,#5E8CAE)'},
{key:'extra',emoji:'🧸',label:'额外收入',type:'income',bg:'#FBE9E6',iconBg:'linear-gradient(135deg,#F9A8D4,#F472B6)'},
{key:'other_inc',emoji:'🎁',label:'其他收入',type:'income',bg:'#E6F2E6',iconBg:'linear-gradient(135deg,#86EFAC,#22C55E)'},
];
const ACCOUNTS=[
{key:'pool',emoji:'🌊',label:'小荷包',bg:'#E6EFF3'},
{key:'fund',emoji:'📈',label:'基金',bg:'#E6F2E6'},
{key:'stock',emoji:'📊',label:'股票',bg:'#ECE8F4'},
];
const AM={};ACCOUNTS.forEach(a=>AM[a.key]=a);

const KT='cou_tx',KR='cou_rules',KF='cou_fixed',KA='cou_alerts',KS='cou_seen',KAC='cou_accounts',KCAT='cou_cats',KGOAL='cou_goal';
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// ===== 共享同步层 =====
const KEYS=[KT,KR,KF,KA,KAC,KCAT,KGOAL,KS];
function getRoom(){const p=new URLSearchParams(location.search).get('room');return p?p:'couple';}
function getMe(){return localStorage.getItem('cou_me')||'me';}
function setMe(v){localStorage.setItem('cou_me',v);}
const ROOM=getRoom();
let SYNC_ON=true, lastRev={};
function apiGet(key){return fetch('/api/room/'+ROOM+(key?'/'+key:''),{cache:'no-store'}).then(r=>r.json()).then(d=>key?d[key]:d).catch(()=>{SYNC_ON=false;return null});}
function apiPut(key,val){if(!SYNC_ON)return Promise.resolve();return fetch('/api/room/'+ROOM+'/'+key,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({[key]:val})}).then(()=>{}).catch(()=>{SYNC_ON=false;});}
// 本地缓存 + 后端双写
function lget(k,d){const c=ld(k,null);if(c!==null)return c;const def=typeof d==='function'?d():d;sv(k,def);return def;}
function lset(k,v){sv(k,v);}
// 包装各 getter/setter 增加后端同步
const _getTx=()=>ld(KT,[]),_addTx=t=>{const a=_getTx();t.id=uid();a.unshift(t);sv(KT,a)},
  _getRules=()=>ld(KR,[]),_saveRules=r=>sv(KR,r),
  _getFixed=()=>ld(KF,[]),_addFixed=f=>{f.id=uid();const a=_getFixed();a.push(f);sv(KF,a)},_removeFixed=id=>sv(KF,_getFixed().filter(f=>f.id!==id)),
  _getAlerts=()=>ld(KA,{balance_threshold:3000,ratio_threshold:0.8}),_saveAlerts=a=>sv(KA,a),
  _getAccts=()=>ld(KAC,{pool:0,fund:0,stock:0}),_saveAccts=a=>sv(KAC,a),
  _getGoal=()=>ld(KGOAL,5000),_saveGoal=g=>sv(KGOAL,g),_getCats=()=>ld(KCAT,[]),_saveCats=c=>sv(KCAT,c);
let getTx=_getTx,addTx=_addTx,getRules=_getRules,saveRules=_saveRules,getFixed=_getFixed,addFixed=_addFixed,removeFixed=_removeFixed,getAlerts=_getAlerts,saveAlerts=_saveAlerts,getAccts=_getAccts,saveAccts=_saveAccts,getGoal=_getGoal,saveGoal=_saveGoal,getCats=_getCats,saveCats=_saveCats;
// 重写同步版（写本地+写后端）
function syncGet(key,localFn){return localFn();}
function pushKey(key){const v=ld(key);apiPut(key,v);}
// 重新定义带同步的接口
addTx=function(t){_addTx(t);pushKey(KT);};
saveRules=function(r){_saveRules(r);pushKey(KR);};
addFixed=function(f){_addFixed(f);pushKey(KF);};
removeFixed=function(id){_removeFixed(id);pushKey(KF);};
saveAlerts=function(a){_saveAlerts(a);pushKey(KA);};
saveAccts=function(a){_saveAccts(a);pushKey(KAC);};
saveGoal=function(g){_saveGoal(g);pushKey(KGOAL);};
saveCats=function(c){_saveCats(c);pushKey(KCAT);};
getCats=function(){return _getCats();};
// init 时从后端拉取全量
async function pullAll(){if(!SYNC_ON)return;const d=await apiGet(null);if(!d)return;for(const k of [KT,KR,KF,KA,KAC,KCAT,KGOAL]){if(d[k]!==undefined)sv(k,d[k]);}refreshCM();}
// 身份
function meBadge(p){return p==='me'?'👦':'👧';}
// 轮询
let pollTimer=null;
function startPoll(){stopPoll();pollTimer=setInterval(async()=>{if(document.hidden)return;const d=await apiGet(null);if(!d)return;let changed=false;for(const k of [KT,KR,KF,KA,KAC,KCAT,KGOAL]){if(d[k]!==undefined){const cur=ld(k,null);if(JSON.stringify(cur)!==JSON.stringify(d[k])){sv(k,d[k]);changed=true;}}}if(changed){refreshCM();const ap=document.querySelector('.page.active')?.id;if(ap==='page-home')renderHome();else if(ap==='page-transactions')renderTx();else if(ap==='page-settings')renderSettings();}},4000);}
function stopPoll(){if(pollTimer)clearInterval(pollTimer);}
function allCats(){return DEF_CATS.concat(getCats());}
function buildCM(){const m={};allCats().forEach(c=>m[c.key]=c);return m;}
let CM=buildCM();
function refreshCM(){CM=buildCM();}
function init(){
  if(!ld(KS,false)){
    sv(KT,[]);
    sv(KR,[{id:uid(),person:'me',amount:2000,payday:28,active:true,note:''},{id:uid(),person:'ta',amount:2000,payday:10,active:true,note:''}]);
    sv(KF,[]);
    sv(KA,{balance_threshold:3000,ratio_threshold:0.8});
    sv(KAC,{pool:0,fund:0,stock:0});
    sv(KCAT,[]);
    sv(KGOAL,5000);
    sv(KS,true);
  }
}
function delTx(id){if(confirm('确定删除这笔记录吗？')){sv(KT,getTx().filter(t=>t.id!==id));renderTx();toast('已删除')}};

function acctBalance(key){
  const accts=getAccts();
  let base=accts[key]||0;
  const txs=getTx();
  if(key==='pool'){
    return base + txs.filter(t=>!t.account||t.account==='pool').reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
  }
  return base + txs.filter(t=>t.account===key).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
}
function totalAssets(){return ACCOUNTS.reduce((s,a)=>s+acctBalance(a.key),0)}
function poolBalance(){return acctBalance('pool')}

function mstat(txs,y,m){const f=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===m});const i=f.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);const x=f.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);return{income:i,expense:x,net:i-x,ratio:i>0?x/i:0}}
function future(fixed,mon){const r=[],t=new Date();t.setHours(0,0,0,0);for(let i=0;i<mon;i++){const tg=new Date(t.getFullYear(),t.getMonth()+i,1);for(const f of fixed){const d=Math.min(f.pay_day,28);let dt;if(f.period==='monthly')dt=new Date(tg.getFullYear(),tg.getMonth(),d);else if(f.period==='quarterly'){if(![0,3,6,9].includes(tg.getMonth()))continue;dt=new Date(tg.getFullYear(),tg.getMonth(),d)}else if(f.period==='yearly'){if(tg.getMonth()!==0)continue;dt=new Date(tg.getFullYear(),0,d)}else continue;if(dt>=t)r.push({date:dt,name:f.name,amount:f.amount})}}r.sort((a,b)=>a.date-b.date);return r}
const f2=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),f0=n=>Math.round(n).toLocaleString('zh-CN');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  document.querySelectorAll(`[data-page="${n}"]`).forEach(t=>t.classList.add('active'));
  refreshCM();
  window.scrollTo(0,0);
  startPoll();
  if(n==='home')renderHome();if(n==='transactions')renderTx();if(n==='settings')renderSettings();if(n==='add')renderAdd();
}

// ===== 首页 =====
function renderHome(){
  refreshCM();
  const txs=getTx(),fx=getFixed(),al=getAlerts(),goal=getGoal();
  const total=totalAssets(),pb=poolBalance();
  const now=new Date(),st=mstat(txs,now.getFullYear(),now.getMonth());
  const fu=future(fx,6).slice(0,3);
  const saved=st.income; // 本月存入
  const pct=goal>0?Math.min(100,Math.round(saved/goal*100)):0;
  let ah='';
  if(pb<al.balance_threshold)ah=`<div style="margin:12px 16px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center"><div style="font-size:22px">🌱</div><div><div style="font-size:13px;font-weight:700;color:var(--warn-text)">小荷包余额告急</div><div style="font-size:11px;color:var(--warn-text);opacity:.8;margin-top:1px">当前 ${f0(pb)} 元，低于预警线 ${f0(al.balance_threshold)} 元</div></div></div>`;
  else if(st.income>0&&st.ratio>al.ratio_threshold)ah=`<div style="margin:12px 16px;background:var(--amber-soft);border:1px solid #EAD9B0;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center"><div style="font-size:22px">🍂</div><div><div style="font-size:13px;font-weight:700;color:#A9824C">本月支出占比偏高</div><div style="font-size:11px;color:#A9824C;opacity:.8;margin-top:1px">占存入的 ${(st.ratio*100).toFixed(0)}%，超过预警线</div></div></div>`;
  const rh=txs.slice(0,5).map(t=>txRow(t)).join('')||`<div style="padding:32px;text-align:center;color:var(--ink-light);font-size:13px">还没有记录<br>点下方 ＋ 记第一笔吧 🌊</div>`;
  const fh=fu.map(f=>{const d=Math.ceil((f.date.getTime()-Date.now())/86400000);const ic=f.name.includes('房')?'🏠':f.name.includes('旅行')?'✈️':f.name.includes('车')?'🚗':'📌';return`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)"><div style="width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:17px">${ic}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink)">${f.name}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:1px">${f.date.getMonth()+1}月${f.date.getDate()}日 · ${d}天后</div></div><div style="font-size:14px;font-weight:700;color:var(--ink)" class="tabular">${f0(f.amount)}</div></div>`}).join('');

  // 可爱攒钱进度环
  const ring=`<div style="padding:0 16px;margin-top:16px"><div class="card" style="padding:18px;display:flex;align-items:center;gap:18px">
    <div style="width:92px;height:92px;border-radius:50%;background:conic-gradient(#82B0C9 ${pct*3.6}deg,#ECE7DA 0);display:flex;align-items:center;justify-content:center;flex-shrink:0"><div style="width:66px;height:66px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 1px 4px rgba(0,0,0,.04)"><div style="font-size:24px">🐷</div><div style="font-size:11px;font-weight:700;color:var(--accent-dark)">${pct}%</div></div></div>
    <div style="flex:1"><div style="font-size:14px;font-weight:700;color:var(--ink)">本月攒钱进度</div><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">已攒 <span style="color:var(--accent-dark);font-weight:700">¥${f0(saved)}</span></div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px">目标 ¥${f0(goal)}</div><div style="font-size:11px;color:var(--ink-light);margin-top:4px">${pct>=100?'🎉 超额完成啦！':`还差 ¥${f0(Math.max(0,goal-saved))} 就达标`}</div></div>
  </div></div>`;

  document.getElementById('page-home').innerHTML=`
  <div class="header-grad" style="padding:42px 20px 24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;position:relative;z-index:2">
      <div><div style="color:rgba(255,255,255,.85);font-size:12px">👋 欢迎回家</div>
      <div style="color:#fff;font-size:18px;font-weight:700;margin-top:2px">努力攒钱 🌊</div></div>
      <div style="display:flex;gap:6px">
        <div onclick="switchMe('me')" style="width:36px;height:36px;border-radius:50%;background:${getMe()==='me'?'#fff':'var(--rose-soft)'};border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;${getMe()==='me'?'box-shadow:0 0 0 2px #fff':''}">👦</div>
        <div onclick="switchMe('ta')" style="width:36px;height:36px;border-radius:50%;background:${getMe()==='ta'?'#fff':'var(--amber-soft)'};border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;${getMe()==='ta'?'box-shadow:0 0 0 2px #fff':''}">👧</div>
      </div>
    </div>
    <div style="color:rgba(255,255,255,.85);font-size:11px;margin-bottom:12px;text-align:right">当前记账身份：${getMe()==='me'?'👦 本人':'👧 TA'}${SYNC_ON?' · 已同步 🔗':' · 本地模式'}</div>

  <h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0 4px">🌊 每月存入规则</h3>
  <div class="card" style="overflow:hidden">
    ${r.map(x=>`<div style="padding:14px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">${x.person==='me'?'👦':'👧'}</span><div><div style="font-size:13px;font-weight:600;color:var(--ink)">${x.person==='me'?'本人':'TA'} · ${x.payday}号发薪</div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px">每月存入 <input type="number" value="${x.amount}" oninput="updRule('${x.id}','amount',parseFloat(this.value)||0)" style="width:56px;padding:2px 4px;font-size:12px;border:1px solid var(--line);border-radius:6px;text-align:center;color:var(--ink)"> 元</div></div></div><div onclick="togRule('${x.id}')" style="padding:5px 12px;border-radius:18px;font-size:12px;font-weight:600;cursor:pointer;${x.active?'background:var(--accent-soft);color:var(--accent-dark)':'background:var(--amber-soft);color:#A9824C'}">${x.active?'✓ 启用':'⏸ 已暂停'}</div></div>${!x.active?`<input type="text" value="${x.note||''}" oninput="updRule('${x.id}','note',this.value)" placeholder="写明暂停原因" style="width:100%;padding:9px 12px;border-radius:10px;border:1px solid #EAD9B0;background:var(--amber-soft);font-size:12px;color:var(--ink)">`:''}</div>`).join('')}
  </div>
</div>
<div style="padding:0 16px;margin-top:18px">
  <h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0 4px">🎯 每月攒钱目标</h3>
  <div class="card" style="padding:16px">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">🐷</span><input type="number" value="${goal}" oninput="saveGoal(parseFloat(this.value)||0);toast('已保存目标 🐷')" style="flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);background:var(--card-soft)"><span style="font-size:13px;color:var(--ink-soft)">元</span></div>
  </div>
</div>
<div style="padding:0 16px;margin-top:18px">
  <h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0 4px">🏷️ 自定义类型</h3>
  <div class="card" style="overflow:hidden">
    ${custom.length===0?`<div style="padding:18px;text-align:center;color:var(--ink-light);font-size:12px">还没有自定义类型<br>下方添加一个试试吧 🌟</div>`:custom.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)"><div style="width:38px;height:38px;border-radius:12px;background:${x.iconBg};display:flex;align-items:center;justify-content:center;font-size:18px">${x.emoji}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink)">${x.label}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:1px">${x.type==='expense'?'支出':'收入'}</div></div><div onclick="delCat('${x.key}')" style="width:34px;height:34px;border-radius:50%;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:15px;cursor:pointer;flex-shrink:0">✕</div></div>`).join('')}
  </div>
  <div class="card" style="padding:14px;margin-top:8px">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">添加自定义类型</div>
    <div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" value="${NC.emoji}" oninput="NC.emoji=this.value" placeholder="😋" style="width:48px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);font-size:18px;text-align:center;background:var(--card-soft)"><input type="text" value="${NC.name}" oninput="NC.name=this.value" placeholder="类型名称" style="flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"><select onchange="NC.type=this.value" style="padding:9px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--ink);background:var(--card-soft)"><option value="expense" ${NC.type==='expense'?'selected':''}>支出</option><option value="income" ${NC.type==='income'?'selected':''}>收入</option></select></div>
    <div onclick="addCat()" class="btn btn-primary" style="width:100%;padding:10px;text-align:center">＋ 添加类型</div>
  </div>
</div>
<div style="padding:0 16px;margin-top:18px">
  <h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0 4px">🚨 预警阈值</h3>
  <div class="card" style="padding:16px">
    <div style="margin-bottom:14px"><label style="font-size:12px;color:var(--ink-soft)">余额预警线（元）</label><input type="number" value="${AL.balance_threshold}" oninput="AL.balance_threshold=parseFloat(this.value)||0" style="width:100%;margin-top:4px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"></div>
    <div style="margin-bottom:14px"><label style="font-size:12px;color:var(--ink-soft)">支出占比预警线</label><div style="display:flex;align-items:center;gap:12px;margin-top:4px"><input type="range" min="0.3" max="1.5" step="0.05" value="${AL.ratio_threshold}" oninput="AL.ratio_threshold=parseFloat(this.value);this.nextElementSibling.textContent=(AL.ratio_threshold*100).toFixed(0)+'%'" style="flex:1;accent-color:var(--accent)"><span style="font-size:14px;font-weight:700;color:var(--accent-dark);width:46px;text-align:right">${(AL.ratio_threshold*100).toFixed(0)}%</span></div></div>
    <div onclick="saveAlerts(AL);toast('已保存 ✓')" class="btn btn-primary" style="width:100%;padding:11px;text-align:center">保存预警设置</div>
  </div>
</div>
<div style="padding:0 16px;margin-top:18px">
  <h3 style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;padding:0 4px">🗓️ 固定支出管理</h3>
  <div class="card" style="overflow:hidden">
    ${f.length===0?`<div style="padding:20px;text-align:center;color:var(--ink-light);font-size:12px">还没有固定支出</div>`:f.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)"><span style="font-size:17px">${x.name.includes('房')?'🏠':x.name.includes('旅行')?'✈️':x.name.includes('车')?'🚗':'📌'}</span><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--ink)">${x.name}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:1px">${{monthly:'每月',quarterly:'每季度',yearly:'每年',custom:'自定义'}[x.period]} · ${x.pay_day}号 · ${f0(x.amount)}元</div></div><div onclick="delFixed('${x.id}')" style="width:34px;height:34px;border-radius:50%;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:15px;cursor:pointer;flex-shrink:0">✕</div></div>`).join('')}
  </div>
  <div class="card" style="padding:14px;margin-top:8px">
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px">添加固定支出</div>
    <div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" value="${NF.name}" oninput="NF.name=this.value" placeholder="名称" style="flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"><input type="number" value="${NF.amount}" oninput="NF.amount=this.value" placeholder="金额" style="width:88px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"></div>
    <div style="display:flex;gap:6px"><select onchange="NF.period=this.value" style="flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"><option value="monthly">每月</option><option value="quarterly">每季度</option><option value="yearly">每年</option></select><input type="number" value="${NF.pay_day}" oninput="NF.pay_day=this.value" placeholder="几号" min="1" max="28" style="width:72px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink);background:var(--card-soft)"><div onclick="addF()" class="btn btn-primary" style="padding:9px 14px">添加</div></div>
  </div>
</div>
<div style="padding:8px 16px;margin-top:16px"><div style="background:var(--accent-soft);border-radius:16px;padding:14px;font-size:12px;color:var(--accent-dark);line-height:1.8"><div style="font-weight:700;margin-bottom:4px">🌊 使用提示</div><div>· 记账时先选账户（小荷包/基金/股票），再选分类</div><div>· 首页「总存款」= 小荷包+基金+股票 之和</div><div>· 可在设置里添加自定义类型（如：奶茶、宠物…）</div><div>· 流水页点右侧 ✕ 删除记录</div><div>· 添加到桌面：Safari分享→添加到主屏幕</div></div></div>
<div style="padding:8px 16px;margin-top:12px;margin-bottom:20px"><div onclick="clearAll()" style="background:var(--rose-soft);border-radius:16px;padding:14px;font-size:13px;color:var(--danger);text-align:center;cursor:pointer;font-weight:600;border:1px solid #E8C9C4">🗑️ 清除所有数据（重新开始）</div></div>
`;
}
function updAcct(k,v){const a=getAccts();a[k]=v;saveAccts(a)}
function togRule(id){saveRules(getRules().map(x=>x.id===id?{...x,active:!x.active}:x));renderSettings()}
function updRule(id,f,v){saveRules(getRules().map(x=>x.id===id?{...x,[f]:v}:x))}
function addF(){if(!NF.name||!parseFloat(NF.amount)){toast('请填写名称和金额');return}addFixed({name:NF.name,amount:parseFloat(NF.amount),period:NF.period,pay_day:parseInt(NF.pay_day)||1});NF={name:'',amount:'',period:'monthly',pay_day:'1'};renderSettings();toast('已添加')}
function delFixed(id){if(confirm('确定删除这项固定支出吗？')){removeFixed(id);renderSettings();toast('已删除')}}
function addCat(){if(!NC.name){toast('请输入类型名称');return}const type=NC.type||'expense';const palette=type==='expense'?['#FBE9E6','#FBF0DC','#FBEFE2','#ECE8F4','#E6F2E6','#E6EFF3']:['#E6EFF3','#E6F2E6','#FBE9E6'];const bg=palette[Math.floor(Math.random()*palette.length)];const grad=type==='expense'?['linear-gradient(135deg,#F9A8D4,#F472B6)','linear-gradient(135deg,#FDE68A,#F59E0B)','linear-gradient(135deg,#FDBA74,#F97316)','linear-gradient(135deg,#C4B5FD,#8B5CF6)','linear-gradient(135deg,#86EFAC,#22C55E)','linear-gradient(135deg,#9CC3D8,#5E8CAE)']:['linear-gradient(135deg,#9CC3D8,#5E8CAE)','linear-gradient(135deg,#86EFAC,#22C55E)','linear-gradient(135deg,#F9A8D4,#F472B6)'];const iconBg=grad[Math.floor(Math.random()*grad.length)];const c=getCats();c.push({key:'c_'+uid(),emoji:NC.emoji||'⭐',label:NC.name,type, bg, iconBg});saveCats(c);refreshCM();NC={emoji:'',name:'',type:'expense'};renderSettings();toast('已添加类型 ⭐')}
function delCat(key){if(confirm('确定删除这个类型吗？')){saveCats(getCats().filter(x=>x.key!==key));refreshCM();renderSettings();toast('已删除')}}
function copyShare(){const i=document.getElementById('shareLink');if(i){i.select();try{document.execCommand('copy');toast('链接已复制 🔗');}catch(e){toast('请手动复制');}}}
function clearAll(){if(confirm('确定清除所有数据？这将删除全部流水和设置，不可撤销！')){if(confirm('再次确认：真的要清除全部数据吗？')){[KT,KF,KS,KR,KAC,KCAT,KGOAL].forEach(k=>localStorage.removeItem(k));init();toast('数据已清空 🌊');showPage('home')}}}
init();
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>showPage(el.dataset.page)));
// 启动时从后端拉取共享数据
pullAll().then(()=>{refreshCM();showPage('home');startPoll();});
</script>
</body>
</html>
